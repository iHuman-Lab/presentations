# Shared reveal.js settings. Paths are NOT set here: Quarto resolves them relative to each deck,
# so every deck sets its own `theme:` and `logo:` (see _template/deck.qmd).
format:
  revealjs:
    slide-number: false
    transition: fade
    background-transition: fade
    footer: "iHuman Lab · Oklahoma State University"
    width: 1280
    height: 720
    margin: 0.1
    navigation-mode: linear
    controls: true
    progress: true
