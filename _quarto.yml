project:
  type: website
  resources:
    - assets/
  render:
    - index.qmd
    - "people/*/*.qmd"
    - "people/*/*/*.qmd"
    - "lab/*/*.qmd"

website:
  title: 'iHuman Lab Presentations'
  favicon: assets/logo.png
  navbar:
    logo: assets/logo.png
    right:
      - icon: github
        href: https://github.com/iHuman-Lab/presentations
        target: _blank
    left:
      - href: index.qmd
        text: Presentations
      - href: https://ihuman-lab.github.io/lab-website/
        text: Lab Website
        target: _blank

format:
  html:
    theme: [cosmo, custom.scss]
    toc: false
    link-external-newwindow: true
